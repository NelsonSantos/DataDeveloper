services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: datadeveloper-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: datadeveloper
      APP_USER: datadeveloper
      APP_USER_PASSWORD: datadeveloper
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  oracle_data:
