name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 26.0329.1)"
        required: true
        type: string
      create_release:
        description: "Publish a GitHub Release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      create_release: ${{ steps.version.outputs.create_release }}
      checkout_ref: ${{ steps.version.outputs.checkout_ref }}
    steps:
      - id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            CREATE_RELEASE="true"
            CHECKOUT_REF="${TAG}"
          else
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
            CREATE_RELEASE="${{ inputs.create_release }}"
            CHECKOUT_REF="${TAG}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "create_release=$CREATE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build macOS package
        run: ./scripts/build-macos-release.sh ${{ matrix.rid }}
        env:
          CONFIGURATION: Release
          VERSION: ${{ needs.resolve-version.outputs.version }}
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: DataDeveloper-${{ matrix.rid }}
          path: artifacts/macos/${{ matrix.rid }}/DataDeveloper-${{ matrix.rid }}.zip

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build Windows publish
        shell: bash
        run: ./scripts/build-windows-release.sh win-x64
        env:
          CONFIGURATION: Release
          VERSION: ${{ needs.resolve-version.outputs.version }}
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y
      - name: Build Windows installer
        shell: powershell
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          "packaging/windows/DataDeveloper.iss"
          "/DAppVersion=${{ needs.resolve-version.outputs.version }}"
          "/DPublishDir=$((Resolve-Path 'artifacts/windows/win-x64/publish').Path)"
          "/DPlatform=win-x64"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: DataDeveloper-win-x64
          path: artifacts/windows/win-x64/DataDeveloper-win-x64-setup.exe

  build-linux:
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 desktop-file-utils
      - name: Build Linux publish
        run: ./scripts/build-linux-release.sh linux-x64
        env:
          CONFIGURATION: Release
          VERSION: ${{ needs.resolve-version.outputs.version }}
      - name: Download appimagetool
        run: |
          curl -L https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
      - name: Build AppImage
        run: APPIMAGE_TOOL="$PWD/appimagetool" APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./packaging/linux/build-appimage.sh artifacts/linux/linux-x64/DataDeveloper.AppDir linux-x64
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v5
        with:
          name: DataDeveloper-linux-x64
          path: artifacts/linux/linux-x64/DataDeveloper-linux-x64.AppImage

  publish-release:
    needs: [resolve-version, build-macos, build-windows, build-linux]
    if: needs.resolve-version.outputs.create_release == 'true' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Archive release notes and reset the unreleased draft
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          UNRELEASED_FILE="release-notes/UNRELEASED.md"
          VERSION_FILE="release-notes/${VERSION}.md"

          if [[ ! -f "$UNRELEASED_FILE" ]]; then
            echo "No $UNRELEASED_FILE found; nothing to archive."
            exit 0
          fi

          if [[ -f "$VERSION_FILE" ]]; then
            echo "$VERSION_FILE already exists; leaving it as-is and just resetting $UNRELEASED_FILE."
          else
            cp "$UNRELEASED_FILE" "$VERSION_FILE"
            sed -i "1s/.*/# Release Notes — ${VERSION}/" "$VERSION_FILE"
          fi

          rm -f "$UNRELEASED_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A release-notes/
          if git diff --cached --quiet; then
            echo "No release-notes changes to commit."
          else
            git commit -m "docs: archive release notes for ${VERSION} [skip ci]"
            git push origin main
          fi
